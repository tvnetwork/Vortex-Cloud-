    <!-- SVG Favicon (Triangle Logo) -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22black%22 stroke=%22black%22 stroke-width=%222%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22><path d=%22m3 21 9-18 9 18z%22/></svg>" />
    <script>
      // Fix for "TypeError: Cannot set property fetch of #<Window> which has only a getter"
      (function() {
        var originalFetch = window.fetch;
        var currentFetch = originalFetch;
        
        function tryDefine(obj) {
          try {
            Object.defineProperty(obj, 'fetch', {
              get: function() { return currentFetch; },
              set: function(v) { currentFetch = v; },
              configurable: true,
              enumerable: true
            });
            return true;
          } catch (e) {
            return false;
          }
        }

        if (!tryDefine(window)) {
          tryDefine(Object.getPrototypeOf(window));
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
